<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal Expense Tracker</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <h1>Personal Expense Tracker</h1>
    <p class="subtitle">Record, manage and track your daily expenses</p>
  </header>

  <main>
    <section class="card" id="form-card">
      <h2 id="form-title">Add Expense</h2>
      <form id="expense-form">
        <input type="hidden" id="expense-id">

        <label>
          Amount (₹)
          <input type="number" id="amount" step="0.01" min="0.01" required placeholder="e.g. 250">
        </label>

        <label>
          Category
          <select id="category" required></select>
        </label>

        <label>
          Date
          <input type="date" id="date" required>
        </label>

        <label class="wide">
          Description
          <input type="text" id="description" maxlength="200" placeholder="e.g. Lunch with friends">
        </label>

        <div class="form-actions wide">
          <button type="submit" id="submit-btn">Add Expense</button>
          <button type="button" id="cancel-btn" class="secondary hidden">Cancel Edit</button>
        </div>
        <p id="form-error" class="error hidden"></p>
      </form>
    </section>

    <section class="card">
      <div class="toolbar">
        <label>
          Category
          <select id="filter-category">
            <option value="">All</option>
          </select>
        </label>
        <label>
          Month
          <input type="month" id="filter-month">
        </label>
        <button type="button" id="clear-filters" class="secondary">Clear Filters</button>
        <div class="total">
          Total: <strong id="total">₹0.00</strong>
        </div>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Date</th>
              <th>Category</th>
              <th>Description</th>
              <th class="num">Amount</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="expense-body"></tbody>
        </table>
        <p id="empty-msg" class="empty hidden">No expenses found.</p>
      </div>
    </section>
  </main>

  <script src="/script.js"></script>
</body>
</html>
